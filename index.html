<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About Paixblox</title>

<style>
:root {
  --navy: #071526;
  --soft: #eaf3ff;
  --gold: #f4b63d;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--navy);
  overflow-x: hidden;
}

.page {
  width: 100%;
  min-height: 100vh;
  background: linear-gradient(135deg, #071526 0%, #0b1f35 100%);
  padding: 22px;
}

.hero-card {
  max-width: 1280px;
  margin: 0 auto;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 22px 60px rgba(0,0,0,0.28);
  background: #eaf3ff;
}

.hero-card img {
  display: block;
  width: 100%;
  height: auto;
}

.actions {
  max-width: 1280px;
  margin: 22px auto 0;
  display: flex;
  justify-content: center;
  gap: 16px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 190px;
  padding: 16px 28px;
  border-radius: 14px;
  font-size: 20px;
  font-weight: 800;
  text-decoration: none;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn-demo {
  background: var(--gold);
  color: #0f172a;
  box-shadow: 0 12px 28px rgba(244,182,61,0.28);
}

.btn-contact {
  background: #0b1220;
  color: white;
  box-shadow: 0 12px 28px rgba(0,0,0,0.24);
}

.footer {
  max-width: 1280px;
  margin: 22px auto 0;
  text-align: center;
  color: rgba(255,255,255,0.72);
  font-size: 14px;
  letter-spacing: 0.2px;
}

/* Mobile */
@media (max-width: 768px) {
  .page {
    min-height: 100vh;
    padding: 12px;
  }

  .hero-card {
    border-radius: 14px;
    box-shadow: 0 14px 34px rgba(0,0,0,0.24);
  }

  .hero-card img {
    width: 100%;
    height: auto;
  }

  .actions {
    margin-top: 16px;
    flex-direction: column;
    gap: 12px;
  }

  .btn {
    width: 100%;
    min-width: 0;
    padding: 16px 20px;
    font-size: 20px;
    border-radius: 14px;
  }

  .footer {
    margin-top: 18px;
    padding-bottom: 8px;
    font-size: 14px;
  }
}
</style>
</head>

<body>

<main class="page">

  <section class="hero-card">
    <img
      src="https://i.ibb.co/WvrxPZrN/Chat-GPT-Image-Apr-24-2026-09-38-23-AM.png"
      alt="About Paixblox"
    />
  </section>

  <section class="actions">
    <a href="https://paixblox.github.io/PB-systems-demo/" class="btn btn-demo">View Demo</a>
    <a href="mailto:ecomill@paixblox.com" class="btn btn-contact">Contact</a>
  </section>

  <footer class="footer">
    Built by Civic EcoMill • PAIXBLOX
  </footer>

</main>

</body>
</html>
