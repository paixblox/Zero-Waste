<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About Paixblox</title>

<style>
:root {
  --navy: #071526;
  --soft: #eaf3ff;
  --gold: #f4b63d;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--navy);
}

/* Page wrapper */
.page {
  width: 100%;
  min-height: 100vh;
  padding: 22px;
}

/* Card */
.hero-card {
  max-width: 1280px;
  margin: 0 auto;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 22px 60px rgba(0,0,0,0.28);
  background: var(--soft);
  position: relative;
}

.hero-card img {
  width: 100%;
  height: auto;
  display: block;
}

/* 🔥 DESKTOP FLOATING BUTTONS */
.actions {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 16px;
}

/* Buttons */
.btn {
  padding: 14px 28px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: 700;
  text-decoration: none;
  transition: transform 0.2s ease;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn-demo {
  background: var(--gold);
  color: #0f172a;
}

.btn-contact {
  background: #0b1220;
  color: white;
}

/* Footer */
.footer {
  margin-top: 20px;
  text-align: center;
  color: rgba(255,255,255,0.7);
  font-size: 14px;
}

/* 🔥 MOBILE FIX */
@media (max-width: 768px) {

  .page {
    padding: 12px;
  }

  .hero-card {
    border-radius: 14px;
  }

  /* move buttons BELOW image on mobile */
  .actions {
    position: static;
    transform: none;
    margin-top: 16px;
    flex-direction: column;
    align-items: center;
  }

  .btn {
    width: 100%;
    max-width: 420px;
    text-align: center;
    font-size: 20px;
    padding: 16px;
  }
}
</style>
</head>

<body>

<main class="page">

  <section class="hero-card">
    <img src="https://i.ibb.co/WvrxPZrN/Chat-GPT-Image-Apr-24-2026-09-38-23-AM.png" alt="About Paixblox">

    <div class="actions">
      <a href="https://paixblox.github.io/PB-systems-demo/" class="btn btn-demo">View Demo</a>
      <a href="mailto:ecomill@paixblox.com" class="btn btn-contact">Contact</a>
    </div>
  </section>

  <div class="footer">
    Built by Civic EcoMill • PAIXBLOX
  </div>

</main>

</body>
</html>
