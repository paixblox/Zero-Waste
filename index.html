<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About Paixblox</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: Inter, system-ui, sans-serif;
  background: #ffffff;
  overflow-x: hidden;
}

/* Fullscreen container */
.hero {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* Fullscreen image */
.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Overlay content */
.overlay {
  position: absolute;
  bottom: 40px;
  width: 100%;
  text-align: center;
}

/* Buttons */
.btn {
  display: inline-block;
  padding: 16px 32px;
  margin: 8px;
  border-radius: 12px;
  font-weight: 700;
  text-decoration: none;
  transition: transform 0.2s ease;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn-demo {
  background: #f4b63d;
  color: #0f172a;
}

.btn-contact {
  background: #0b1220;
  color: white;
}

/* Footer */
.footer {
  position: absolute;
  bottom: 10px;
  width: 100%;
  text-align: center;
  font-size: 12px;
  color: rgba(255,255,255,0.7);
}
</style>
</head>

<body>

<div class="hero">

  <img src="https://i.ibb.co/WvrxPZrN/Chat-GPT-Image-Apr-24-2026-09-38-23-AM.png">

  <div class="overlay">
<a href="https://paixblox.github.io/PB-systems-demo/" class="btn btn-demo">View Demo</a>
    <a href="mailto:ecomill@paixblox.com" class="btn btn-contact">Contact</a>
  </div>

  <div class="footer">
    Built by Civic EcoMill • PAIXBLOX
  </div>

</div>

</body>
</html>
