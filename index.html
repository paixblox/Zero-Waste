<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About Paixblox</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  font-family: Inter, system-ui, sans-serif;
  background: #eef6fb;
  overflow-x: hidden;
}

.hero {
  position: relative;
  width: 100vw;
  min-height: 100vh;
  overflow: hidden;
  background: #eef6fb;
}

.hero img {
  width: 100%;
  height: 100vh;
  object-fit: cover;
  display: block;
}

.overlay {
  position: absolute;
  bottom: 44px;
  width: 100%;
  text-align: center;
  z-index: 2;
}

.btn {
  display: inline-block;
  padding: 16px 32px;
  margin: 8px;
  border-radius: 12px;
  font-weight: 700;
  text-decoration: none;
  transition: transform 0.2s ease;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn-demo {
  background: #f4b63d;
  color: #0f172a;
}

.btn-contact {
  background: #0b1220;
  color: white;
}

.footer {
  position: absolute;
  bottom: 12px;
  width: 100%;
  text-align: center;
  font-size: 12px;
  color: rgba(255,255,255,0.78);
  z-index: 2;
}

/* Mobile optimization */
@media (max-width: 768px) {
  .hero {
    min-height: auto;
  }

  .hero img {
    width: 100%;
    height: auto;
    object-fit: contain;
  }

  .overlay {
    position: static;
    width: 100%;
    padding: 18px 16px 8px;
    background: linear-gradient(180deg, #eef6fb 0%, #eaf3ff 100%);
  }

  .btn {
    display: block;
    width: min(86%, 320px);
    margin: 10px auto;
    padding: 15px 24px;
  }

  .footer {
    position: static;
    padding: 14px 12px 24px;
    color: #64748b;
    background: #eaf3ff;
  }
}
</style>
</head>

<body>

<div class="hero">

  <img src="https://i.ibb.co/WvrxPZrN/Chat-GPT-Image-Apr-24-2026-09-38-23-AM.png" alt="About Paixblox">

  <div class="overlay">
    <a href="https://paixblox.github.io/PB-systems-demo/" class="btn btn-demo">View Demo</a>
    <a href="mailto:ecomill@paixblox.com" class="btn btn-contact">Contact</a>
  </div>

  <div class="footer">
    Built by Civic EcoMill • PAIXBLOX
  </div>

</div>

</body>
</html>
